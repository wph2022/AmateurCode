<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChargeLog Historian Mirror</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#718096;--line:#e6eaf1;--brand:#6658e8;--warn:#e49a24}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}header{height:72px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#6658e8,#986bf5)}.actions{display:flex;gap:9px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.pri{background:linear-gradient(135deg,#6658e8,#9067ed);color:#fff}.sec{background:#fff;color:#4d5870}main{max-width:1360px;margin:auto;padding:24px}.hero{border-radius:20px;padding:24px 26px;color:#fff;background:linear-gradient(125deg,#222d42,#343a69 62%,#6551ce);display:flex;justify-content:space-between;align-items:center}.hero h1{margin:5px 0;font-size:26px}.hero small{color:#b9c2d5}.pill{padding:8px 11px;border-radius:999px;background:#ffffff17;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:15px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi span{font-size:10px;color:#8993a6}.kpi b{display:block;font-size:19px;margin-top:7px}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 9px 30px rgba(29,42,72,.06)}h3{margin:2px 0 13px;font-size:14px}.chart{height:400px;border:1px solid #edf0f5;border-radius:12px;overflow:hidden;background:#fbfcff;position:relative}.chart canvas{width:100%;height:100%;display:block}.findings{display:grid;gap:9px}.finding{border:1px solid #ebedf2;border-radius:12px;padding:12px}.finding b{font-size:12px}.finding p{font-size:10px;color:#748095;line-height:1.6}.sev{display:inline-block;font-size:8px;font-weight:900;padding:4px 7px;border-radius:999px;background:#fff1da;color:#a76b17}.raw{margin-top:15px}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;outline:0}.rawlist{height:360px;overflow:auto;margin-top:10px;font:10px/1.5 Consolas,monospace}.row{display:grid;grid-template-columns:55px 92px 70px 1fr;gap:8px;padding:7px 5px;border-top:1px solid #f0f2f6}.src{color:#657087}.note{margin-top:10px;font-size:10px;color:#8a94a7}@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){main{padding:12px}.kpis{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:42px 80px 1fr}.src{display:none}}</style></head><body><header><div class="brand"><div class="logo">⚡</div>ChargeLog Historian <span style="font-size:9px;color:#98a4b8">MIRROR</span></div><div class="actions"><button id="sample" class="btn sec">加载示例</button><label class="btn pri">导入日志<input id="file" type="file" accept=".txt,.log,.out" hidden></label></div></header><main><section class="hero"><div><small>CHARGING LOG ANALYSIS</small><h1 id="device">Android Device</h1><small id="meta">Browser-local parser · 日志不上传服务器</small></div><div class="pill" id="soc">SOC --</div></section><div id="kpis" class="kpis"></div><div class="grid"><section class="card"><h3>统一充电时间轴</h3><div class="chart"><canvas id="cv"></canvas></div><div class="note">显示 SOC / Battery Current / Power / Temperature，所有数据共用同一时间轴。</div></section><section class="card"><h3>诊断发现</h3><div id="findings" class="findings"></div></section></div><section class="card raw"><h3>原始日志 Evidence</h3><input id="q" class="search" placeholder="搜索 charger / thermal / fcc / pps ..."><div id="raw" class="rawlist"></div></section></main><script>const $=x=>document.getElementById(x),KV=/([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(-?\d+(?:\.\d+)?|[A-Za-z_]+)/g;const sample=`# device: ChargeLab X1 Pro\n# android: 16\n2026-08-11 09:50:00.000 BatteryService: level=12 voltage=3650 temperature=310 status=charging\n2026-08-11 09:50:00.000 charger: current_now=4200000 fcc=8000000 vbus=11000000 ibus=2800000 pps=1\n2026-08-11 09:54:00.000 BatteryService: level=22 voltage=3780 temperature=342 status=charging\n2026-08-11 09:54:00.000 charger: current_now=6500000 fcc=8000000 vbus=11000000 ibus=3100000 pps=1\n2026-08-11 09:58:00.000 BatteryService: level=34 voltage=3910 temperature=374 status=charging\n2026-08-11 09:58:00.000 charger: current_now=7200000 fcc=8000000 vbus=11000000 ibus=3120000 pps=1\n2026-08-11 10:02:00.000 BatteryService: level=47 voltage=4020 temperature=402 status=charging\n2026-08-11 10:02:00.000 charger: current_now=7100000 fcc=8000000 vbus=11000000 ibus=3050000 pps=1\n2026-08-11 10:06:00.000 BatteryService: level=59 voltage=4110 temperature=419 status=charging\n2026-08-11 10:06:00.000 charger: current_now=7000000 fcc=8000000 vbus=11000000 ibus=3000000 pps=1\n2026-08-11 10:08:00.000 BatteryService: level=65 voltage=4160 temperature=431 status=charging\n2026-08-11 10:08:00.000 charger: current_now=4900000 fcc=5600000 vbus=11000000 ibus=2150000 thermal_limit=1 pps=1\n2026-08-11 10:12:00.000 BatteryService: level=72 voltage=4210 temperature=425 status=charging\n2026-08-11 10:12:00.000 charger: current_now=4600000 fcc=5400000 vbus=11000000 ibus=2000000 thermal_limit=1 pps=1\n2026-08-11 10:20:00.000 BatteryService: level=83 voltage=4320 temperature=412 status=charging\n2026-08-11 10:20:00.000 charger: current_now=3900000 fcc=4200000 vbus=9000000 ibus=1680000 pps=0\n2026-08-11 10:32:00.000 BatteryService: level=96 voltage=4460 temperature=401 status=charging\n2026-08-11 10:32:00.000 charger: current_now=1300000 fcc=1900000 vbus=9000000 ibus=570000 pps=0\n2026-08-11 10:39:30.000 BatteryService: level=100 voltage=4460 temperature=395 status=full\n2026-08-11 10:39:30.000 charger: current_now=560000 fcc=1200000 vbus=9000000 ibus=350000 pps=0`;let S=null;function tstamp(s){let m=s.match(/^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)\.(\d{3})/);return m?new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6],+m[7]).getTime():null}function time(t){return new Date(t).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'})}function parse(txt,name){let lines=txt.split(/\r?\n/),series={soc:[],current:[],temp:[],power:[]},raw=[],dev='Android Device';for(let i=0;i<lines.length;i++){let l=lines[i];if(l.startsWith('# device:'))dev=l.slice(9).trim();let t=tstamp(l);if(t==null)continue;let p={},m;KV.lastIndex=0;while((m=KV.exec(l)))p[m[1].toLowerCase()]=m[2];raw.push({n:i+1,t,src:/thermal/i.test(l)?'thermal':/charger|fcc|icl/i.test(l)?'charger':/battery/i.test(l)?'battery':'log',text:l});let n=x=>x==null?null:+x,v=n(p.level??p.soc);if(v!=null)series.soc.push([t,v]);v=n(p.current_now??p.current);if(v!=null){if(Math.abs(v)>50000)v/=1000;series.current.push([t,Math.abs(v)])}v=n(p.temperature??p.temp);if(v!=null){if(Math.abs(v)>100)v/=10;series.temp.push([t,v])}let vb=n(p.vbus),ib=n(p.ibus);if(vb!=null&&ib!=null){if(vb>1e5)vb/=1000;if(ib>5e4)ib/=1000;series.power.push([t,vb/1000*ib/1000])}}let all=[...series.soc,...series.current,...series.temp,...series.power];if(!all.length)throw Error('没有识别到充电指标');let st=Math.min(...all.map(x=>x[0])),ed=Math.max(...all.map(x=>x[0])),soc=series.soc,cur=series.current,tmp=series.temp,pow=series.power;let p20=soc.find(x=>x[1]>=20),p80=soc.find(x=>x[1]>=80),find=[];if(tmp.length){let pk=tmp.reduce((a,b)=>a[1]>b[1]?a:b);if(pk[1]>=42)find.push(['电池温度偏高',`最高温度 ${pk[1].toFixed(1)}°C，建议结合 Thermal/FCC 状态确认。`])}if(cur.length>=4)for(let i=3;i<cur.length;i++){let a=(cur[i-1][1]+cur[i-2][1]+cur[i-3][1])/3,b=cur[i][1];if(a>3000&&b<a*.72){find.push(['充电电流明显下降',`约 ${a.toFixed(0)}mA → ${b.toFixed(0)}mA，下降 ${((a-b)/a*100).toFixed(0)}%。`]);break}}return{name,dev,series,raw,st,ed,soc0:soc[0]?.[1],soc1:soc.at(-1)?.[1],dur:(ed-st)/1000,t2080:p20&&p80?(p80[0]-p20[0])/1000:null,peakI:cur.length?Math.max(...cur.map(x=>x[1])):null,peakP:pow.length?Math.max(...pow.map(x=>x[1])):null,maxT:tmp.length?Math.max(...tmp.map(x=>x[1])):null,find}}function fmt(s){return s==null?'--':`${Math.floor(s/60)}m ${String(Math.round(s%60)).padStart(2,'0')}s`}function apply(d){S=d;$('device').textContent=d.dev;$('meta').textContent=`${d.name} · Browser-local parser · 日志不上传服务器`;$('soc').textContent=`SOC ${d.soc0??'--'} → ${d.soc1??'--'}%`;let a=[['充电时长',fmt(d.dur)],['20→80%',fmt(d.t2080)],['峰值电流',d.peakI?`${(d.peakI/1000).toFixed(2)} A`:'--'],['峰值功率',d.peakP?`${d.peakP.toFixed(1)} W`:'--'],['最高温度',d.maxT?`${d.maxT.toFixed(1)} °C`:'--'],['诊断发现',String(d.find.length)]];$('kpis').innerHTML=a.map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');$('findings').innerHTML=d.find.length?d.find.map(x=>`<div class="finding"><span class="sev">WARNING</span><p><b>${x[0]}</b></p><p>${x[1]}</p></div>`).join(''):'<div class="finding"><b>未发现明显异常</b></div>';renderRaw();draw()}function renderRaw(){if(!S)return;let q=$('q').value.toLowerCase(),a=S.raw.filter(x=>!q||x.text.toLowerCase().includes(q)||x.src.includes(q)).slice(0,2000);$('raw').innerHTML=a.map(x=>`<div class="row"><span>${x.n}</span><span>${time(x.t)}</span><span class="src">${x.src}</span><span>${x.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span></div>`).join('')}function draw(){if(!S)return;let c=$('cv'),r=c.parentElement.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=r.width*dpr;c.height=r.height*dpr;let g=c.getContext('2d');g.scale(dpr,dpr);let W=r.width,H=r.height,L=64,R=15,T=18,B=30,sets=[['SOC',S.series.soc,'%',0,100,'#6658e8'],['Current',S.series.current,'mA',0,null,'#2386d5'],['Power',S.series.power,'W',0,null,'#e09022'],['Temp',S.series.temp,'°C',null,null,'#d55069']].filter(x=>x[1].length),th=(H-T-B-(sets.length-1)*9)/sets.length,X=t=>L+(t-S.st)/(S.ed-S.st)*(W-L-R);g.clearRect(0,0,W,H);for(let i=0;i<=5;i++){let x=L+(W-L-R)*i/5;g.strokeStyle='#edf0f4';g.beginPath();g.moveTo(x,T);g.lineTo(x,H-B);g.stroke();g.fillStyle='#8993a5';g.font='9px sans-serif';g.fillText(time(S.st+(S.ed-S.st)*i/5),Math.min(x,W-55),H-10)}sets.forEach((s,i)=>{let y=T+i*(th+9),v=s[1].map(x=>x[1]),mn=s[3]??Math.min(...v),mx=s[4]??Math.max(...v);if(mx===mn)mx=mn+1;let pad=(mx-mn)*.08;if(s[3]==null)mn-=pad;if(s[4]==null)mx+=pad;let Y=a=>y+th-(a-mn)/(mx-mn)*th;g.fillStyle='#687386';g.font='700 9px sans-serif';g.fillText(s[0],7,y+11);g.strokeStyle=s[5];g.lineWidth=2;g.beginPath();s[1].forEach((p,j)=>j?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.stroke()})}$('sample').onclick=()=>apply(parse(sample,'sample_charging.log'));$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{apply(parse(await f.text(),f.name))}catch(x){alert('分析失败：'+x.message)}};$('q').oninput=renderRaw;window.onresize=draw;apply(parse(sample,'sample_charging.log'));</script></body></html>
